spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025

storage:
  type: local
  local:
    base-path: ./target/test-storage

jwt:
  secret: test-secret-key-for-testing-purposes-only
  expiration: 3600000