spring:
  application:
    name: retreat-reserve

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_ENV_VARIABLE}
  expiration: 86400000 # 24 hours in milliseconds

# Email Configuration
email:
  from: ${EMAIL_FROM:noreply@retreatreserve.com}
  verification-base-url: ${VERIFICATION_BASE_URL:http://localhost:3000/auth/verify}

# Storage Configuration
storage:
  type: ${STORAGE_TYPE:local} # local or s3
  local:
    base-path: ${LOCAL_STORAGE_PATH:./storage/images}
    url-prefix: ${LOCAL_URL_PREFIX:http://localhost:8080/api/v1/images}
  s3:
    bucket-name: ${AWS_S3_BUCKET:retreat-reserve-images}
    region: ${AWS_REGION:us-east-1}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Logging
logging:
  level:
    com.retreatreserve: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE