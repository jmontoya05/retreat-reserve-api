<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Reservation Cancellation</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; background-color: #f9f9f9; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Reservation Cancelled</h1>
        </div>
        <div class="content">
            <h2>Hello {{userName}},</h2>
            <p>Your reservation for <strong>{{cabinName}}</strong> has been cancelled.</p>
            <p>We're sorry to see you go. If you have any questions, please contact our support team.</p>
            <p>We hope to see you again soon!</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Retreat Reserve. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
